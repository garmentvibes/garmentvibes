name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    name: Lint, build, static QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Runs in about a second, so it goes before the build — a broken
      # invariant should fail the job without waiting on a compile.
      - run: npm run test
      - run: npm run build
      - run: npm run qa:static
      # Both of these are generated from the mock catalogue and committed, so
      # both can fall behind it. A stale seed ships last week's prices; a
      # missing placeholder is a broken image on a product page, and nothing
      # else in the suite would notice either.
      - run: npm run placeholders:check
      - run: npm run seed:check

  schema:
    name: Migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of the build: this job exercises SQL against a real Postgres
    # and never touches Next.js, so there is nothing to wait for.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # psql and pg_isready both read these, so the script needs no CI-specific
      # branch — it talks to a socket locally and to the service container here.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # No npm install: the schema checks shell out to psql and import nothing.
      - run: npm run qa:schema

  e2e:
    name: Route sweep + E2E QA
    runs-on: ubuntu-latest
    needs: static
    # The browser suites take ~3 minutes. Without a cap, a wedged page would
    # hang the job until GitHub's 6-hour default kills it, which reads as
    # "still running" rather than a failure.
    timeout-minutes: 20
    # Job-level, not step-level, and that placement is the point.
    #
    # NEXT_PUBLIC_* is inlined at BUILD time, so the build step needs it — but
    # the QA scripts also assert against it (the QR's payload, the sitemap's
    # origin), so the test steps need the *same* value. Setting it once here
    # makes them agree by construction; setting it per-step let them drift and
    # the QR check compared a baked-in ci.garmentvibes.test against a default
    # of localhost.
    #
    # RAZORPAY_WEBHOOK_SECRET is a dummy so the payment signature checks can
    # run against a known key. Deliberately NOT NEXT_PUBLIC_RAZORPAY_KEY_ID:
    # that one *is* inlined at build time and would switch the storefront to
    # the real gateway, breaking the simulated checkout the suite drives.
    #
    # ALLOW_DEMO_ADMIN lets the suite reach the admin panel without a Supabase
    # project. It is honoured ONLY when no Supabase project is configured (see
    # demoAdminEnabled() in src/lib/auth/demo.ts, and the test that pins that
    # behaviour) — so this cannot leak into a real deployment by being copied.
    # The panel's data is still localStorage, so a database would buy the
    # admin suite nothing but a login.
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.garmentvibes.test
      RAZORPAY_WEBHOOK_SECRET: qa-test-webhook-secret
      ALLOW_DEMO_ADMIN: "1"
      DEMO_ADMIN_SECRET: qa-test-demo-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core doesn't bundle a browser (kept out of node_modules on
      # purpose) — install just Chromium + its OS deps for this run.
      - run: npx playwright-core install --with-deps chromium
      # Picks up NEXT_PUBLIC_SITE_URL from the job env above. Without it the
      # build looks like an unconfigured deployment and robots.txt correctly
      # returns a blanket Disallow — right in production, but it would make
      # the SEO checks below assert nothing useful.
      - run: npm run build
      - name: Start production server in background
        run: nohup npm run start > server.log 2>&1 &
      - name: Wait for server to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"; cat server.log; exit 1
      - run: npm run qa:routes
      - run: npm run qa:e2e
      - run: npm run qa:pwa
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

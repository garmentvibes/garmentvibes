name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    name: Lint, build, static QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run qa:static

  e2e:
    name: Route sweep + E2E QA
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core doesn't bundle a browser (kept out of node_modules on
      # purpose) — install just Chromium + its OS deps for this run.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Start production server in background
        run: nohup npm run start > server.log 2>&1 &
      - name: Wait for server to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"; cat server.log; exit 1
      - run: npm run qa:routes
      - run: npm run qa:e2e
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    name: Lint, build, static QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Runs in about a second, so it goes before the build — a broken
      # invariant should fail the job without waiting on a compile.
      - run: npm run test
      - run: npm run build
      - run: npm run qa:static

  e2e:
    name: Route sweep + E2E QA
    runs-on: ubuntu-latest
    needs: static
    # The browser suites take ~3 minutes. Without a cap, a wedged page would
    # hang the job until GitHub's 6-hour default kills it, which reads as
    # "still running" rather than a failure.
    timeout-minutes: 20
    # Job-level, not step-level, and that placement is the point.
    #
    # NEXT_PUBLIC_* is inlined at BUILD time, so the build step needs it — but
    # the QA scripts also assert against it (the QR's payload, the sitemap's
    # origin), so the test steps need the *same* value. Setting it once here
    # makes them agree by construction; setting it per-step let them drift and
    # the QR check compared a baked-in ci.garmentvibes.test against a default
    # of localhost.
    #
    # RAZORPAY_WEBHOOK_SECRET is a dummy so the payment signature checks can
    # run against a known key. Deliberately NOT NEXT_PUBLIC_RAZORPAY_KEY_ID:
    # that one *is* inlined at build time and would switch the storefront to
    # the real gateway, breaking the simulated checkout the suite drives.
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.garmentvibes.test
      RAZORPAY_WEBHOOK_SECRET: qa-test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core doesn't bundle a browser (kept out of node_modules on
      # purpose) — install just Chromium + its OS deps for this run.
      - run: npx playwright-core install --with-deps chromium
      # Picks up NEXT_PUBLIC_SITE_URL from the job env above. Without it the
      # build looks like an unconfigured deployment and robots.txt correctly
      # returns a blanket Disallow — right in production, but it would make
      # the SEO checks below assert nothing useful.
      - run: npm run build
      - name: Start production server in background
        run: nohup npm run start > server.log 2>&1 &
      - name: Wait for server to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"; cat server.log; exit 1
      - run: npm run qa:routes
      - run: npm run qa:e2e
      - run: npm run qa:pwa
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
